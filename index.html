    <!-- Content-Security-Policy: второй рубеж защиты от XSS. Ограничивает, откуда
         грузятся скрипты и куда браузеру разрешено отправлять данные. Даже если на
         страницу попадёт чужой код, он не сможет отправить украденное на посторонний
         сервер и не загрузится со стороннего домена.
         connect-src — только наш backend, CDN, метрика и геокодер подсказок. -->

      default-src 'self';

      frame-src https://mc.yandex.ru https://mc.yandex.com;
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    "/>
